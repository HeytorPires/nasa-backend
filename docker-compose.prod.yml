name: nasa-backend

services:
    app:
        image: ghcr.io/heytorpires/nasa-backend:${IMAGE_TAG:-latest}
        build: .
        container_name: nasa-backend-app
        restart: unless-stopped
        env_file: .env
        environment:
            - NODE_ENV=production
        ports:
            - "${PORT}:${PORT}"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:18
        container_name: nasa-backend-postgres
        restart: unless-stopped
        command: ["postgres", "-p", "${DB_PORT:-5432}"]
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        volumes:
            - postgres_18_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME} -p ${DB_PORT:-5432}"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: nasa-backend-redis
        restart: unless-stopped
        command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_18_data:
    redis_data:
