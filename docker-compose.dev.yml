services:
    postgres:
        image: postgres:18
        container_name: nasa_db
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: appuser
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: appdb
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - app-net
    api:
        image: node:24-alpine
        container_name: api_server
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: production
            DATABASE_URL: postgresql://appuser:secret@postgres:5432/appdb
        volumes:
            - .:/app
        depends_on:
            - postgres
        restart: unless-stopped
        command: node server.js
        networks:
            - app-net
volumes:
    postgres_data:
networks:
    app-net:
        driver: bridge
