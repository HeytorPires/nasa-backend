services:
    postgres:
        image: postgres:18
        container_name: postgres-container
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        volumes:
            - postgres_18_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: redis-container
        restart: unless-stopped
        ports:
            - "6379:6379"

    app:
        build: .
        restart: unless-stopped
        container_name: nodejs-app-container
        depends_on:
            - postgres
            - redis
        ports:
            - "${PORT}:${PORT}"
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - NASA_API_KEY=${NASA_API_KEY}
            - PORT=${PORT}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes:
            - .:/app

volumes:
    postgres_18_data:
